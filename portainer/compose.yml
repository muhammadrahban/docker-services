# ----------------------------------------------------------------------------------------------------------
# This is a Docker Compose file for setting up Portainer container management.
# ----------------------------------------------------------------------------------------------------------
# WARNING:
# This file is for local development and staging environments only.
# DO NOT USE THIS FILE IN PRODUCTION ENVIRONMENTS.
# ----------------------------------------------------------------------------------------------------------

services:
  service-portainer:
    container_name: "service-portainer"
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      # HTTP Router (redirects to HTTPS)
      - "traefik.http.routers.service-portainer.entrypoints=http"
      - "traefik.http.routers.service-portainer.rule=Host(`${TRAEFIK_HOSTNAME}`)"
      - "traefik.http.middlewares.service-portainer-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.service-portainer.middlewares=service-portainer-https-redirect"
      # HTTPS Router
      - "traefik.http.routers.service-portainer-secure.entrypoints=https"
      - "traefik.http.routers.service-portainer-secure.rule=Host(`${TRAEFIK_HOSTNAME}`)"
      - "traefik.http.routers.service-portainer-secure.tls=true"
      - "traefik.http.services.service-portainer.loadbalancer.server.port=9000"
      - "traefik.http.services.service-portainer.loadbalancer.server.scheme=http"
    ports:
      - "9000:9000"
    networks:
      - reverse-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data

volumes:
  portainer_data:

networks:
  reverse-proxy:
    external: true