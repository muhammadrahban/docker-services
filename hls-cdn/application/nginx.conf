# ----------------------------------------------------------------------------------------------------------
# HLS CDN edge nginx config — caches segments, passes playlists, in front of
# service-hls-origin. This is the viewer-facing LL-HLS endpoint.
# ----------------------------------------------------------------------------------------------------------
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # m4s is not in nginx's default mime.types; m3u8/ts/mp4 already are.
    types {
        video/iso.segment  m4s;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    access_log off;
    error_log  /var/log/nginx/error.log warn;

    # Resolve the origin container name at request time via docker embedded DNS,
    # so the CDN can start before the origin and recover if it restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Edge cache zone ──────────────────────────────────────────────────────
    # Segments are immutable, so they cache for a long time. Playlists are
    # proxied with a tiny/again-revalidated cache so LL-HLS stays near-live.
    proxy_cache_path /var/cache/nginx/hls
        levels=1:2
        keys_zone=hls_cache:20m
        max_size=2g
        inactive=60s
        use_temp_path=off;

    server {
        listen 80;
        server_name _;

        # Origin host resolved at runtime (see resolver above).
        set $hls_origin "service-hls-origin";

        # CORS for cross-origin players (hls.js, Safari, etc.)
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_http_version 1.1;

        # Strip the origin's CORS + cache headers so the edge is the single
        # source of these (avoids duplicate "Access-Control-Allow-Origin: *, *"
        # which strict browsers reject).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Cache-Control;

        # ── Playlists (.m3u8): keep near-live, do NOT serve stale ─────────────
        location ~ \.m3u8$ {
            proxy_pass http://$hls_origin:80$request_uri;
            proxy_set_header Host $host;

            # Cache playlists for only 1s so LL-HLS updates flow through quickly,
            # while still absorbing request spikes from large viewer counts.
            proxy_cache hls_cache;
            proxy_cache_valid 200 1s;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            proxy_cache_background_update on;

            add_header Cache-Control "no-cache" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # ── Segments (.ts/.m4s/.mp4): immutable, cache hard ───────────────────
        location ~ \.(ts|m4s|mp4)$ {
            proxy_pass http://$hls_origin:80$request_uri;
            proxy_set_header Host $host;

            proxy_cache hls_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;

            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location / {
            proxy_pass http://$hls_origin:80$request_uri;
            proxy_set_header Host $host;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }
}
