# ----------------------------------------------------------------------------------------------------------
# HLS Origin nginx config — serves LL-HLS playlists + segments from /hls.
# ----------------------------------------------------------------------------------------------------------
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # m4s is not in nginx's default mime.types; m3u8/ts/mp4 already are.
    types {
        video/iso.segment  m4s;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Access log off for media noise; errors still logged.
    access_log off;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # All HLS assets live under /hls/<roomName>/...
        root /hls;

        # CORS — players fetch playlists/segments cross-origin.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        # Preflight short-circuit.
        if ($request_method = OPTIONS) {
            return 204;
        }

        location / {
            # Allow byte-range requests (HLS players use them for segments).
            add_header Accept-Ranges bytes always;

            # Playlists must never be cached — for LL-HLS they update constantly.
            location ~ \.m3u8$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Access-Control-Allow-Origin "*" always;
                expires -1;
            }

            # Media segments are immutable once written — cache them hard.
            location ~ \.(ts|m4s|mp4)$ {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                add_header Access-Control-Allow-Origin "*" always;
            }

            try_files $uri =404;
        }

        # Lightweight health endpoint for the CDN / orchestration to probe.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }
}
