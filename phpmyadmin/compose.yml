# ----------------------------------------------------------------------------------------------------------
# This is a Docker Compose file for setting up a depends_on service.

# ----------------------------------------------------------------------------------------------------------
# WARNING:
# This file is for local development and staging environments only.
# DO NOT USE THIS FILE IN PRODUCTION ENVIRONMENTS.
# ----------------------------------------------------------------------------------------------------------

services:

  service-phpmyadmin:
    container_name: "service-phpmyadmin"
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      # HTTP Router (redirects to HTTPS)
      - "traefik.http.routers.service-phpmyadmin.entrypoints=http"
      - "traefik.http.routers.service-phpmyadmin.rule=Host(`${TRAEFIK_HOSTNAME}`)"
      - "traefik.http.middlewares.service-phpmyadmin-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.service-phpmyadmin.middlewares=service-phpmyadmin-https-redirect"
      # HTTPS Router
      - "traefik.http.routers.service-phpmyadmin-secure.entrypoints=https"
      - "traefik.http.routers.service-phpmyadmin-secure.rule=Host(`${TRAEFIK_HOSTNAME}`)"
      - "traefik.http.routers.service-phpmyadmin-secure.tls=true"
      - "traefik.http.services.service-phpmyadmin.loadbalancer.server.port=80"
      - "traefik.http.services.service-phpmyadmin.loadbalancer.server.scheme=http"
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      MAX_EXECUTION_TIME: ${MAX_EXECUTION_TIME}
      MEMORY_LIMIT: ${MEMORY_LIMIT}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
    ports:
      - "5584:80"
    networks:
      - reverse-proxy

networks:
  reverse-proxy:
    external: true
