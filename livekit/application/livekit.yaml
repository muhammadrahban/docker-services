# LiveKit server configuration (with Redis so Egress works)
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 51000
  port_range_end: 51100
  use_external_ip: false

# API key/secret — must match the app .env (LIVEKIT_API_KEY / LIVEKIT_API_SECRET)
keys:
  devkey: secret

# Redis is required for Egress to work (service name on the reverse-proxy network)
redis:
  address: service-livestream-redis:6379

prometheus_port: 6789

# Embedded TURN server — improves connectivity for clients behind restrictive firewalls.
# TURN/UDP on port 443: some firewalls allow UDP over 443 (QUIC/HTTP3), and UDP is
# preferred over TCP for WebRTC (better congestion/latency control).
turn:
  enabled: true
  udp_port: 443

# Runtime processing webhook delivery
# Sends room lifecycle events to Opic3D runtime API running on host machine.
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:8000/runtime/livekit/webhook
